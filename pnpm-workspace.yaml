# RN/Expo 는 hoisted 링킹을 쓴다 — Metro/네이티브 autolinking 이 심볼릭 링크 트리를 전제하지
# 않는다(Expo 권장, 참조 앱 KR/JP 동일). .npmrc 의 node-linker 와 같은 값을 둔다.
nodeLinker: hoisted
# postinstall/스크립트를 pnpm 내장 셸로 실행 — rm -rf 같은 POSIX 문법이 OS 상관없이 동작한다.
shellEmulator: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  aws-sdk: false # @hot-updater/aws의 전이 의존. postinstall은 node 버전 경고 출력만 — 불필요
  '@firebase/util': false # RNFB 전이 의존. postinstall은 웹 전용 __FIREBASE_DEFAULTS__ 파일 생성 — RN 미사용
  protobufjs: false # RNFB 전이 의존. postinstall은 CLI 스캐폴딩만 — 런타임 무관
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - expo-build-properties@57.0.20
